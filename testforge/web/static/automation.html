<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestForge UI Automation</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#5f6b7a;--border:#dde2e8;--accent:#2f6fde;--accent-soft:#e7effc;
  --ok:#1f8a4c;--ok-soft:#e5f4eb;--bad:#c2362b;--bad-soft:#fbe9e7;--skip:#8a94a3;--code-bg:#f1f3f6}
@media (prefers-color-scheme: dark){:root{--bg:#0f1216;--panel:#171b21;--text:#e6e9ed;--muted:#97a1ad;--border:#2a313a;
  --accent:#6a9cf0;--accent-soft:#1d2a40;--ok:#4cc27e;--ok-soft:#14291d;--bad:#ef6b60;--bad-soft:#331a17;--skip:#6b7480;--code-bg:#11151a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:7px;font-weight:500}
nav a.on{background:var(--accent-soft);color:var(--text)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;padding:18px 24px;max-width:1500px;margin:0 auto}
@media (max-width:980px){main{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
h2{margin:0 0 10px;font-size:15px}
h3{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=search],input[type=number]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:7px 10px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;font-weight:600;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--border);font-weight:500}
button:disabled{opacity:.5;cursor:default}
.list{max-height:330px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.item{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item label{flex:1;cursor:pointer}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;margin:2px 4px 0 0}
.bug{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--border);border-radius:8px;padding:10px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:12px}
.progress{height:6px;background:var(--code-bg);border-radius:999px;overflow:hidden;margin-bottom:12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
.result{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.result summary{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none}
.result summary::-webkit-details-marker{display:none}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.badge.passed{background:var(--ok-soft);color:var(--ok)}
.badge.failed,.badge.error{background:var(--bad-soft);color:var(--bad)}
.result .name{flex:1;min-width:0}
.result .body{padding:8px 12px 12px;border-top:1px solid var(--border)}
.steps{margin:0;padding-left:20px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.steps li.passed::marker{color:var(--ok)}
.steps li.failed{color:var(--bad)}
.steps li.skipped{color:var(--skip)}
.msg{white-space:pre-wrap;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px;font-size:12.5px;margin:8px 0}
.shot{max-width:100%;border:1px solid var(--border);border-radius:6px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--border);border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>🧪 TestForge</h1>
  <nav><a href="/">Unit test generation</a><a href="/automation" class="on">UI automation</a><a href="/demo" target="_blank" rel="noopener">Demo app ↗</a></nav>
</header>
<main>
  <section class="panel">
    <h2>Test scenarios</h2>
    <input type="search" id="filter" placeholder="Search scenarios by name or tag (e.g. cart, form, negative)…" aria-label="Search scenarios">
    <div class="row">
      <button class="secondary" id="all">Select all</button>
      <button class="secondary" id="none">Select none</button>
      <span class="muted" id="selcount"></span>
    </div>
    <div class="list" id="scenarios"></div>

    <h3>Inject bugs into the demo app</h3>
    <p class="muted" style="margin:0 0 6px">Tick bugs to break ShopLite on purpose, then run: good tests should fail.</p>
    <div id="bugs"></div>

    <h3>Options</h3>
    <div class="row"><label for="timeout" class="muted">Assertion timeout (ms)</label>
      <input type="number" id="timeout" value="3000" min="500" max="30000" step="500" style="width:110px"></div>

    <div class="row">
      <button id="run">▶ Run selected scenarios</button>
      <button class="secondary" id="hunt" title="Inject each ticked bug (or all bugs) one at a time and check which scenarios catch it">🐞 Run bug hunt</button>
      <button class="secondary" id="open">Open demo app ↗</button>
    </div>
    <p class="muted" id="status"></p>
  </section>

  <section class="panel">
    <h2>Results</h2>
    <div class="stats">
      <div class="stat"><div class="v" id="s-passed">–</div><div class="k">passed</div></div>
      <div class="stat"><div class="v" id="s-failed">–</div><div class="k">failed</div></div>
      <div class="stat"><div class="v" id="s-total">–</div><div class="k">scenarios</div></div>
      <div class="stat"><div class="v" id="s-time">–</div><div class="k">time</div></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="results"><div class="empty">Choose scenarios and press “Run selected scenarios”.</div></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let scenarios = [], running = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  scenarios = await (await fetch("/api/ui/scenarios")).json();
  $("scenarios").innerHTML = scenarios.map((s, i) => `
    <div class="item" data-i="${i}" data-hay="${esc((s.name + " " + s.tags.join(" ")).toLowerCase())}">
      <input type="checkbox" id="sc${i}" checked>
      <label for="sc${i}">${esc(s.name)}<br>${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
        <span class="muted" style="font-size:12px">${s.steps.length} steps</span></label>
    </div>`).join("");
  $("scenarios").addEventListener("change", count);
  const bugs = await (await fetch("/api/ui/bugs")).json();
  $("bugs").innerHTML = bugs.map(b => `<label class="bug"><input type="checkbox" value="${esc(b.id)}">
    <span><b>${esc(b.id)}</b> <span class="muted">${esc(b.description)}</span></span></label>`).join("");
  count();
}
function visibleItems() { return [...document.querySelectorAll("#scenarios .item")].filter(el => !el.classList.contains("hidden")); }
function selected() { return [...document.querySelectorAll("#scenarios .item")].filter(el => el.querySelector("input").checked).map(el => scenarios[+el.dataset.i].name); }
function bugsSel() { return [...document.querySelectorAll("#bugs input:checked")].map(x => x.value); }
function count() { $("selcount").textContent = `${selected().length} of ${scenarios.length} selected`; }

$("filter").addEventListener("input", () => {
  const q = $("filter").value.trim().toLowerCase();
  document.querySelectorAll("#scenarios .item").forEach(el => el.classList.toggle("hidden", !!q && !el.dataset.hay.includes(q)));
});
$("all").onclick = () => { visibleItems().forEach(el => el.querySelector("input").checked = true); count(); };
$("none").onclick = () => { visibleItems().forEach(el => el.querySelector("input").checked = false); count(); };
$("open").onclick = () => { const b = bugsSel(); window.open("/demo" + (b.length ? "?bugs=" + b.join(",") : ""), "_blank", "noopener"); };
$("run").onclick = () => start("run");
$("hunt").onclick = () => start("bughunt");

function setBusy(b, msg) { running = b; $("run").disabled = $("hunt").disabled = b; $("status").textContent = msg || ""; }
function stats(p, f, t, ms) { $("s-passed").textContent = p; $("s-failed").textContent = f; $("s-total").textContent = t;
  $("s-time").textContent = ms == null ? "–" : (ms / 1000).toFixed(1) + "s"; }

async function start(mode) {
  if (running) return;
  const names = selected();
  if (!names.length) { $("status").textContent = "Select at least one scenario."; return; }
  const body = {mode, names, bugs: bugsSel(), timeout_ms: +$("timeout").value || 3000};
  setBusy(true, mode === "bughunt" ? "Bug hunt running: every bug is injected and all selected scenarios run against it…" : "Running in a real (headless) Chromium browser…");
  $("results").innerHTML = ""; $("bar").style.width = "0"; stats("–", "–", names.length, null);
  const res = await fetch("/api/ui/runs", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) { setBusy(false, "Error: " + (await res.json()).detail); return; }
  const {run_id} = await res.json();
  let passed = 0, failed = 0, done = 0, total = names.length, huntRows = [], huntTotal = mode === "bughunt" ? (body.bugs.length || document.querySelectorAll("#bugs input").length) : 0;
  const es = new EventSource(`/api/runs/${run_id}/events`);
  es.onmessage = ev => {
    const {kind, data} = JSON.parse(ev.data);
    if (kind === "scenario_start") { $("status").textContent = `Running ${data.index}/${data.total}: ${data.name}`; }
    else if (kind === "scenario_done") {
      done++; data.status === "passed" ? passed++ : failed++;
      stats(passed, failed, total, null); $("bar").style.width = (100 * done / total) + "%";
      $("results").insertAdjacentHTML("beforeend", resultHtml(data));
    } else if (kind === "run_done") { stats(data.passed, data.failed, data.passed + data.failed, data.duration_ms); }
    else if (kind === "bug_start") { $("status").textContent = `Injecting bug “${data.bug}” and running ${total} scenarios…`; }
    else if (kind === "bug_done") {
      huntRows.push(data); $("bar").style.width = (100 * huntRows.length / huntTotal) + "%";
      $("results").innerHTML = huntHtml(huntRows, null);
    } else if (kind === "report" && data.mode === "bughunt") {
      $("results").innerHTML = huntHtml(Object.entries(data.bugs).map(([bug, caught_by]) => ({bug, caught_by})), data);
      stats(data.detected, data.total - data.detected, data.total, null);
      $("s-passed").nextElementSibling.textContent = "bugs caught"; $("s-failed").nextElementSibling.textContent = "bugs missed";
      $("s-total").nextElementSibling.textContent = "bugs injected";
    } else if (kind === "error") { $("status").textContent = "⚠ " + data.message; }
  };
  es.addEventListener("end", () => { es.close(); setBusy(false, "Finished."); if (mode === "run") resetLabels(); });
  es.onerror = () => { es.close(); setBusy(false, "Connection lost."); };
}
function resetLabels() { $("s-passed").nextElementSibling.textContent = "passed"; $("s-failed").nextElementSibling.textContent = "failed"; $("s-total").nextElementSibling.textContent = "scenarios"; }

function resultHtml(r) {
  const steps = r.steps.map(s => `<li class="${s.status}">${esc(s.description)} <span class="muted">${s.status === "skipped" ? "skipped" : s.duration_ms + " ms"}</span></li>`).join("");
  return `<details class="result" ${r.status !== "passed" ? "open" : ""}>
    <summary><span class="badge ${r.status}">${r.status.toUpperCase()}</span><span class="name">${esc(r.name)}</span>
      <span class="muted">${(r.duration_ms / 1000).toFixed(2)}s</span></summary>
    <div class="body">${r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}<ol class="steps">${steps}</ol>
      ${r.screenshot_png_b64 ? `<img class="shot" alt="Screenshot at the failing step" src="data:image/png;base64,${r.screenshot_png_b64}">` : ""}</div>
  </details>`;
}
function huntHtml(rows, report) {
  const head = report ? `<p><b>Bug detection rate: ${report.detected}/${report.total} (${Math.round(100 * report.detection_rate)}%)</b>
    ${report.clean_failures.length ? `<br><span style="color:var(--bad)">Warning: ${report.clean_failures.length} scenario(s) already fail on the clean app.</span>` : " · all scenarios pass on the clean app"}</p>` : "";
  return head + `<table><tr><th>Injected bug</th><th>Result</th><th>Caught by</th></tr>${rows.map(r => `<tr>
    <td><b>${esc(r.bug)}</b></td><td><span class="badge ${r.caught_by.length ? "passed" : "failed"}">${r.caught_by.length ? "CAUGHT" : "MISSED"}</span></td>
    <td>${r.caught_by.length ? r.caught_by.map(esc).join("<br>") : '<span class="muted">no scenario failed: add a test for this</span>'}</td></tr>`).join("")}</table>`;
}
load();
</script>
</body>
</html>
