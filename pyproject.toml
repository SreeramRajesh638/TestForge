[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge"
version = "0.2.0"
description = "Autonomous multi-agent unit test generation with mutation-guided refinement"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.13",
    "pydantic>=2.6",
    "pytest>=8",
    "coverage>=7.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
    "playwright>=1.45",
]

[project.scripts]
testforge = "testforge.cli:main"

[tool.setuptools.packages.find]
include = ["testforge*"]

[tool.setuptools.package-data]
"testforge.web" = ["static/*", "static/vendor/*", "static/app/*", "static/app/assets/*"]
"testforge.uiauto" = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
